name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint

      - name: Lint EJS Views and CSS Tokens
        run: npm run lint:views

      - name: Lint i18n Dictionaries
        run: npm run lint:i18n

      - name: Verify Seed Snapshot and Media Assets
        run: npm run test:seed

      - name: Security Audit (High Severity Report)
        run: npm audit --audit-level=high || echo "::warning::High severity vulnerabilities detected in dependencies"
